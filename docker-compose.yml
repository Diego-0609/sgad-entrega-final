# Levanta TODO el SGAD con un comando:   docker compose up -d --build
# Servicios: mongo (base de datos) <- backend (Spring Boot) <- frontend (nginx + Angular)
# Solo el frontend (nginx) se expone al exterior; MongoDB y el backend quedan en la red interna.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db          # los datos sobreviven aunque se recree el contenedor
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ./sgad-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy   # espera a que MongoDB esté listo antes de arrancar
    environment:
      SGAD_MONGO_URI: mongodb://mongo:27017/sgad
      SGAD_JWT_SECRET: ${SGAD_JWT_SECRET:?Falta SGAD_JWT_SECRET en el archivo .env (mínimo 32 caracteres)}
      SGAD_JWT_EXPIRATION: ${SGAD_JWT_EXPIRATION:-3600}
      SGAD_FRONTEND_URL: ${SGAD_FRONTEND_URL:-http://localhost}
      SGAD_COOKIE_SECURE: ${SGAD_COOKIE_SECURE:-false}
      SGAD_SESSION_TIMEOUT: ${SGAD_SESSION_TIMEOUT:-15m}
      SGAD_USUARIOS_DEMO: ${SGAD_USUARIOS_DEMO:-true}
      SGAD_ADMIN_PASSWORD: ${SGAD_ADMIN_PASSWORD:-admin123}
      SGAD_GOOGLE_CLIENT_ID: ${SGAD_GOOGLE_CLIENT_ID:-}
      SGAD_GOOGLE_CLIENT_SECRET: ${SGAD_GOOGLE_CLIENT_SECRET:-}

  frontend:
    build: ./sgad-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # SGAD_BIND_IP=127.0.0.1 en un servidor con Caddy delante: el SGAD solo se alcanza por HTTPS (Docker se salta el firewall ufw al publicar puertos)
      - "${SGAD_BIND_IP:-0.0.0.0}:${SGAD_HTTP_PORT:-80}:80"

volumes:
  mongo_data:
