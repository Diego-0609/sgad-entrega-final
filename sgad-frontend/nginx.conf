# nginx = la puerta de entrada del sistema: un solo origen para el navegador, así la cookie y el JWT no tienen problemas de CORS.
#   /               -> la app Angular (archivos estáticos)
#   /api, /login... -> se reenvían al backend
# Es una plantilla: al arrancar, la imagen de nginx reemplaza ${PORT}, ${BACKEND_URL} y ${NGINX_RESOLVER}
# (valores por defecto en el Dockerfile; en Railway se cambian con variables de entorno).

# Si delante hay otro proxy con HTTPS (Caddy, Cloudflare...), se respeta su X-Forwarded-Proto
map $http_x_forwarded_proto $esquema {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen ${PORT};
    server_name _;

    # Resolver el backend al momento de cada petición (no al arrancar) evita que nginx falle si el backend tarda en levantar
    resolver ${NGINX_RESOLVER} valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas que atiende el backend: API, login/registro, Google (OAuth2) y páginas Thymeleaf
    location ~ ^/(api|login|logout|registro|oauth2|panel|admin|entrenador|publico|403|error|css|js|webjars)(/|$) {
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_redirect off;
    }

    # Todo lo demás es Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
