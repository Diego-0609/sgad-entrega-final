<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>SGAD · Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">SGAD · Panel</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light small">
                Conectado como <b sec:authentication="name">usuario</b>
            </span>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="mb-4">Resumen general</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-4 col-6">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h1 th:text="${totalEscuelas}">0</h1>
                    <p class="text-muted mb-0">Escuelas</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-6">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h1 th:text="${totalEntrenadores}">0</h1>
                    <p class="text-muted mb-0">Entrenadores</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-6">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h1 th:text="${totalDeportistas}">0</h1>
                    <p class="text-muted mb-0">Deportistas</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-6">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h1 th:text="${totalEntrenamientos}">0</h1>
                    <p class="text-muted mb-0">Entrenamientos</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-6">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h1 th:text="${totalAsistencias}">0</h1>
                    <p class="text-muted mb-0">Asistencias</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-6">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h1 th:text="${totalMateriales}">0</h1>
                    <p class="text-muted mb-0">Materiales</p>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <a href="/admin/zona" class="btn btn-dark" sec:authorize="hasRole('ADMIN')">Zona administrador</a>
        <a href="/entrenador/zona" class="btn btn-outline-dark" sec:authorize="hasAnyRole('ADMIN','ENTRENADOR')">Zona entrenador</a>
    </div>
</div>
</body>
</html>
