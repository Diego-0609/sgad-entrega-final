<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGAD · Zona entrenador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">SGAD · Zona entrenador</span>
        <a href="/panel" class="btn btn-outline-light btn-sm">Volver al panel</a>
    </div>
</nav>

<div class="container py-5">
    <h3 class="mb-3">Entrenadores</h3>
    <table class="table table-striped table-bordered mb-5">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Especialidad</th><th>Teléfono</th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${entrenadores}">
            <td th:text="${e.idEntrenador}"></td>
            <td th:text="${e.nombre}"></td>
            <td th:text="${e.especialidad}"></td>
            <td th:text="${e.telefono}"></td>
        </tr>
        </tbody>
    </table>

    <h3 class="mb-3">Entrenamientos</h3>
    <table class="table table-striped table-bordered mb-5">
        <thead class="table-dark">
        <tr><th>ID</th><th>Fecha</th><th>Hora</th><th>Lugar</th></tr>
        </thead>
        <tbody>
        <tr th:each="t : ${entrenamientos}">
            <td th:text="${t.idEntrenamiento}"></td>
            <td th:text="${t.fecha}"></td>
            <td th:text="${t.hora}"></td>
            <td th:text="${t.lugar}"></td>
        </tr>
        </tbody>
    </table>

    <h3 class="mb-3">Deportistas</h3>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Edad</th><th>Deporte</th></tr>
        </thead>
        <tbody>
        <tr th:each="d : ${deportistas}">
            <td th:text="${d.idDeportista}"></td>
            <td th:text="${d.nombre}"></td>
            <td th:text="${d.edad}"></td>
            <td th:text="${d.deporte}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
