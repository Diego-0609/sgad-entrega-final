<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SGAD · Zona administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">SGAD · Zona administrador</span>
        <a href="/panel" class="btn btn-outline-light btn-sm">Volver al panel</a>
    </div>
</nav>

<div class="container py-5">
    <h3 class="mb-3">Escuelas</h3>
    <table class="table table-striped table-bordered mb-5">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${escuelas}">
            <td th:text="${e.idEscuela}"></td>
            <td th:text="${e.nombre}"></td>
            <td th:text="${e.direccion}"></td>
            <td th:text="${e.telefono}"></td>
        </tr>
        </tbody>
    </table>

    <h3 class="mb-3">Materiales</h3>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Cantidad</th><th>Estado</th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${materiales}">
            <td th:text="${m.idMaterial}"></td>
            <td th:text="${m.nombre}"></td>
            <td th:text="${m.cantidad}"></td>
            <td th:text="${m.estado}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
