# ───────────────────────────────────────────────────────────────
# Conexión a MongoDB (base de datos "sgad")
# Si usas MongoDB Atlas en vez de una instancia local, reemplaza esta
# linea por tu cadena de conexion, ej:
# spring.data.mongodb.uri=mongodb+srv://usuario:password@cluster.mongodb.net/sgad
# ───────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${SGAD_MONGO_URI:mongodb://localhost:27017/sgad}
# Necesario para que @Indexed(unique = true) (ej. username de Usuario) se cree solo
spring.data.mongodb.auto-index-creation=true

# En Railway y similares el puerto lo define la variable PORT
server.port=${PORT:8080}

# CORS pa que Angular pueda conectar
spring.web.cors.allowed-origins=${SGAD_FRONTEND_URL:http://localhost:4200}

# URL del frontend Angular (a donde se redirige después de iniciar sesión)
sgad.frontend-url=${SGAD_FRONTEND_URL:http://localhost:4200}

# ───────────────────────────────────────────────────────────────
# ADMINISTRACIÓN DE SESIONES
# ───────────────────────────────────────────────────────────────
# Tiempo de vida de la sesión por inactividad (se renueva con cada petición).
# Se puede cambiar sin tocar el código:  SGAD_SESSION_TIMEOUT=2m
server.servlet.session.timeout=${SGAD_SESSION_TIMEOUT:15m}
# La cookie de sesión no es legible desde JavaScript y no viaja en peticiones cruzadas "peligrosas"
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En un servidor con HTTPS poner SGAD_COOKIE_SECURE=true (la cookie solo viaja cifrada)
server.servlet.session.cookie.secure=${SGAD_COOKIE_SECURE:false}
# El id de sesión solo viaja en cookie (nunca en la URL ;jsessionid=...)
server.servlet.session.tracking-modes=cookie
# Sesiones simultáneas permitidas por usuario (la más antigua se cierra al exceder el límite)
sgad.session.max-por-usuario=1

# ───────────────────────────────────────────────────────────────
# CONTROL DE ERRORES
# ───────────────────────────────────────────────────────────────
# Nunca mostrar mensajes internos ni stacktraces al cliente
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ───────────────────────────────────────────────────────────────
# JWT (JSON Web Token)
# ───────────────────────────────────────────────────────────────
# Clave con la que se FIRMAN los tokens (mínimo 32 caracteres). En un servidor define SGAD_JWT_SECRET.
sgad.jwt.secret=${SGAD_JWT_SECRET:sgad-clave-SOLO-para-desarrollo-cambiala-en-produccion-123456}
# Vida del token en segundos (3600 = 1 hora)
sgad.jwt.expiration-seconds=${SGAD_JWT_EXPIRATION:3600}

# ───────────────────────────────────────────────────────────────
# OAuth2 / OpenID Connect con Google
# ───────────────────────────────────────────────────────────────
# Se crean en https://console.cloud.google.com (APIs y servicios > Credenciales). Si están vacías,
# el login con Google queda desactivado y el resto del sistema funciona igual.
sgad.google.client-id=${SGAD_GOOGLE_CLIENT_ID:}
sgad.google.client-secret=${SGAD_GOOGLE_CLIENT_SECRET:}
# Opcional. Por defecto: {baseUrl}/login/oauth2/code/google
sgad.google.redirect-uri=${SGAD_GOOGLE_REDIRECT_URI:}

# Detrás de un proxy (nginx) la app debe leer X-Forwarded-Proto/Host para armar bien las URLs (Google, redirecciones)
server.forward-headers-strategy=framework

# ───────────────────────────────────────────────────────────────
# USUARIOS INICIALES
# ───────────────────────────────────────────────────────────────
# Desarrollo/clase: se crean admin, entrenador y deportista con claves de demostración.
# En un servidor público: SGAD_USUARIOS_DEMO=false (solo se crea "admin") y SGAD_ADMIN_PASSWORD=<tu clave>.
# (Solo se aplica al crear el usuario; si "admin" ya existe en MongoDB, su clave no cambia.)
sgad.demo-users=${SGAD_USUARIOS_DEMO:true}
sgad.admin-password=${SGAD_ADMIN_PASSWORD:admin123}
